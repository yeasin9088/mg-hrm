name: Dashboard joining UI validation
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/dashboard-ux.test.cjs
      - sw.js
      - tests/transfer.test.cjs
      - tests/transfer-integrity.test.cjs
      - supabase/migrations/*transfer_due*
      - supabase/functions/web-push-sender/**
      - tests/rich-push.test.cjs
      - .github/workflows/dashboard-joining-ui-test.yml
  pull_request:
    paths:
      - index.html
      - tests/dashboard-joining-ui.test.cjs
      - tests/transfer*.test.cjs
      - .github/workflows/dashboard-joining-ui-test.yml
  workflow_dispatch:

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Node regression tests
        run: node --test tests/*.test.cjs
      - name: Lint
        run: npm run lint
      - name: Whitespace check
        run: git diff --check HEAD~1 HEAD
