name: Notification Phase 6 Integrated Workflow
on:
  pull_request:
    paths:
      - 'supabase/migrations/*notification_workflow_completion.sql'
      - 'supabase/migrations/*notification_source_truth_alignment.sql'
      - 'notification-workflow-ui.*'
      - 'tests/notification-workflow*'
      - 'scripts/test-notification-workflow-concurrency.mjs'
      - '.github/workflows/notification-workflow.yml'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notification_workflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_workflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: notification_workflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-concurrency=1 tests/*.test.cjs tests/*.test.mjs
      - run: node scripts/test-notification-workflow-concurrency.mjs
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.0
      - name: Install Chromium headless shell
        timeout-minutes: 4
        run: npx playwright install chromium --only-shell
      - run: node tests/notification-workflow-browser.mjs
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-workflow-six-viewports
          path: artifacts/notification-workflow/
