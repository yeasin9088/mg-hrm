name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package public application assets
        run: node scripts/build-pages.mjs

      - name: Install image converter for approved app icons
        run: |
          if command -v convert >/dev/null && command -v identify >/dev/null; then
            convert -version
          else
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y -qq imagemagick
          fi
      - name: Render approved main app icon in installable PNG sizes
        run: |
          convert _site/app-logo-192.webp -filter Lanczos -resize 192x192 -strip _site/icon-192.png
          convert _site/app-logo-192.webp -filter Lanczos -resize 512x512 -strip _site/icon-512.png
          test "$(identify -format '%wx%h' _site/icon-192.png)" = "192x192"
          test "$(identify -format '%wx%h' _site/icon-512.png)" = "512x512"
          test "$(identify -format '%wx%h' _site/notification-small-m-96.png)" = "96x96"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_attempt_1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 3)
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
