name: Read-aware notification follow-up checks
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261022135600_read_aware_notification_followups.sql'
      - 'scripts/test-reminder-db.mjs'
      - 'docs/notifications/read-aware-followup-policy.md'
      - '.github/workflows/read-aware-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Synthetic isolated PostgreSQL notification regression tests
        run: npm run test:reminder-db
      - name: JavaScript and repository regression checks
        run: |
          npm run lint
          node --test tests/*.test.cjs
      - name: Whitespace check
        run: git diff --check
