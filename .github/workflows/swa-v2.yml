name: Smart Work Assistant V2 foundation
on:
  pull_request:
    paths:
      - 'swa-*.js'
      - 'swa-ui.css'
      - 'index.html'
      - 'sw.js'
      - 'scripts/build-pages.mjs'
      - 'supabase/migrations/*swa*.sql'
      - 'tests/swa*'
      - 'scripts/swa*'
      - '.github/workflows/swa-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax
        run: |
          node --check swa-model.js
          node --check swa-ui.js
          node --check sw.js
      - name: Run synthetic timing and package tests
        run: node --test tests/swa-model.test.cjs tests/pages-package.test.cjs
      - name: Whitespace and conflict check
        run: git diff --check
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swa_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: swa_ci
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL test client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap isolated synthetic source schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/swa-ci-bootstrap.sql
      - name: Apply V2 migration ONLY to synthetic CI database
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022232000_swa_v2_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022235000_swa_rejected_approval_followthrough.sql
      - name: Validate permissions, idempotency and independent stage actions
        run: psql -v ON_ERROR_STOP=1 -f scripts/swa-ci-assertions.sql
