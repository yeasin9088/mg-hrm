<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>সংযোগ নেই — MG-HRM</title>
  <style>
    :root {color-scheme:light; font-family:system-ui,-apple-system,'Noto Sans Bengali',sans-serif;color:#111827;background:#f4f6fb}
    * {box-sizing:border-box} body {margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main {width:min(100%,440px);padding:32px 28px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 14px 50px #11182712}
    img {height:68px;width:68px;object-fit:contain} h1 {font-size:1.55rem;margin:16px 0 6px} p {color:#4b5563;line-height:1.7;margin-bottom:22px}
    button {border:0;border-radius:12px;background:#4f46e5;color:#fff;font:inherit;font-weight:650;padding:13px 22px;min-height:46px;cursor:pointer}
    button:focus-visible {outline:3px solid #818cf8;outline-offset:3px}
    small {display:block;color:#6b7280;margin-top:16px}
  </style>
</head>
<body>
  <main role="main">
    <img src="./icon-192.png" alt="MG-HRM">
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>কর্মচারীদের তথ্য ও HRM কার্যক্রমের সঠিক অবস্থা যাচাই করতে অনলাইনে সংযোগ প্রয়োজন। নিরাপত্তার জন্য পুরোনো রেকর্ডকে নতুন তথ্য হিসেবে দেখানো হচ্ছে না।</p>
    <button type="button" onclick="location.replace('./index.html')">আবার চেষ্টা করুন</button>
    <small>MG-HRM · Offline safety mode</small>
  </main>
</body>
</html>
